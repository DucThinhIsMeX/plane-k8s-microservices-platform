apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-config
  namespace: plane
data:
  # Cấu hình địa chỉ truy cập ứng dụng
  WEB_URL: "http://localhost"
  NEXT_PUBLIC_API_BASE_URL: "http://localhost"
  CORS_ALLOWED_ORIGINS: "*"
  DEBUG: "0"

  # Cấu hình Redis Cache & Celery Broker nội bộ trong cụm
  REDIS_URL: "redis://plane-redis:6379/0"
  CELERY_BROKER_URL: "redis://plane-redis:6379/1"

  # Cấu hình Tầng Lưu trữ Đối tượng AWS S3 (Native PaaS)
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET_NAME: "plane-assets-store"
  USE_MINIO: "0"
