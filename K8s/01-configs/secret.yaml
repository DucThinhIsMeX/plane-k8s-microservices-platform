apiVersion: v1
kind: Secret
metadata:
  name: plane-secret
  namespace: plane
type: Opaque
stringData:
  # Chuỗi kết nối tới AWS RDS PostgreSQL (Stateful Data Store ngoài cụm K8s)
  # Định dạng: postgresql://<user>:<password>@<rds-endpoint>:5432/<dbname>
  DATABASE_URL: "postgresql://plane_admin:PlaneSecretPass2026!@rds-postgres-endpoint.rds.amazonaws.com:5432/plane"

  # Khóa bí mật bảo mật mã hóa session và token JWT của Django Core
  SECRET_KEY: "plane-django-secure-production-secret-key-graduation-project-2026"
  MACHINE_SIGNATURE: "plane-cluster-node-signature-7b89d42e61a"

  # Thông tin xác thực AWS S3 truy cập lưu trữ tệp đính kèm
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_KEY"
