apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-gen
  namespace: robot-shop
  labels:
    app: load-gen
spec:
  replicas: 0 # Mặc định để 0 để không gây tải hệ thống, scale lên 1 khi cần test/demo
  selector:
    matchLabels:
      app: load-gen
  template:
    metadata:
      labels:
        app: load-gen
    spec:
      containers:
      - name: load-gen
        image: robotshop/rs-load:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: HOST
          value: "http://web:8080/"
        - name: NUM_CLIENTS
          value: "50"
        - name: RUN_TIME
          value: "0"
        - name: ERROR
          value: "0"
        - name: SILENT
          value: "1"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi

