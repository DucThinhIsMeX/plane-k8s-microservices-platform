apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-worker
    app.kubernetes.io/component: async-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-worker
  template:
    metadata:
      labels:
        app: plane-worker
    spec:
      containers:
        - name: worker
          image: makeplane/plane-backend:v1.5.0
          imagePullPolicy: IfNotPresent
          command: ["./bin/docker-entrypoint-worker.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
            - secretRef:
                name: plane-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
