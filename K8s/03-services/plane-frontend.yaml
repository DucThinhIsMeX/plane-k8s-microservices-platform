apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-frontend
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plane-frontend
  template:
    metadata:
      labels:
        app: plane-frontend
    spec:
      containers:
        - name: frontend
          image: makeplane/plane-frontend:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
          envFrom:
            - configMapRef:
                name: plane-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: plane-frontend
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http-web
  selector:
    app: plane-frontend
