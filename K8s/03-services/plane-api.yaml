apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plane-api
  template:
    metadata:
      labels:
        app: plane-api
    spec:
      containers:
        - name: api
          image: makeplane/plane-backend:v1.5.0
          imagePullPolicy: IfNotPresent
          command: ["./bin/docker-entrypoint-api.sh"]
          ports:
            - containerPort: 8000
              name: http-api
          envFrom:
            - configMapRef:
                name: plane-config
            - secretRef:
                name: plane-secret
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: plane-api
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http-api
  selector:
    app: plane-api
