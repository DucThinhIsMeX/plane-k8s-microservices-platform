# =========================================================================
# HORIZONTAL POD AUTOSCALER (HPA v2) CHO TOÀN BỘ 8 STATELESS MICROSERVICES
# Lưu ý: Các dịch vụ CSDL có trạng thái (mongodb, mysql, redis, rabbitmq) 
# KHÔNG sử dụng HPA thông thường vì gắn với PVC (ReadWriteOnce), tránh tranh chấp ghi ổ cứng.
# =========================================================================

# 1. API GATEWAY & FRONTEND
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: robot-shop
  labels:
    app: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30

